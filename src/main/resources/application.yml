server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/atlas}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        spring.json.add.type.headers: 'false'
        # The outbox relay dispatches a whole poll batch before flushing (ADR-0013); let the
        # producer accumulate those sends briefly and ship them in few broker round-trips.
        linger.ms: 20
        batch.size: 65536
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: 'com.atlas.inventory.event'
        spring.json.value.default.type: com.atlas.inventory.event.EventEnvelope
        spring.json.use.type.headers: 'false'

atlas:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  inventory:
    reservation:
      # Reservation Time-To-Live. The TTL sweep expires due RESERVED reservations.
      # Per the cascading timeout budget (services/inventory/state_machine.md, features/
      # booking-expiration *Timeout Ownership* addendum) it SHALL be >= the Payment timeout
      # and < the Booking pending-timeout safety-net (30m), so a reservation never expires
      # while payment is legitimately in flight.
      ttl: ${INVENTORY_RESERVATION_TTL:15m}
      sweep-interval-ms: ${INVENTORY_RESERVATION_SWEEP_INTERVAL_MS:60000}
    hotel:
      # Per-night hotel calendar (ADR-0008). Seeding materializes the nights [today, today + horizon);
      # the rolling job keeps the window this size and purges completed nights after the retention.
      horizon-days: ${INVENTORY_HOTEL_HORIZON_DAYS:365}
      purge-after-days: ${INVENTORY_HOTEL_PURGE_AFTER_DAYS:7}
      # "today" advances once a day, so the rolling job runs daily by default.
      roll-interval-ms: ${INVENTORY_HOTEL_ROLL_INTERVAL_MS:86400000}
      roll-initial-delay-ms: ${INVENTORY_HOTEL_ROLL_INITIAL_DELAY_MS:60000}

management:
  server:
    port: 9090
  tracing:
    baggage:
      remote-fields:
        - correlationId
      correlation:
        fields:
          - correlationId
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo.atlas-observability:4318/v1/traces}
  metrics:
    distribution:
      # Native Prometheus histogram buckets for HTTP server timings, so Grafana can compute
      # p95/p99 and draw per-endpoint latency heatmaps (RED / APM). Roadmap Phase 6/7.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.atlas: INFO
    org.springframework.security: WARN
