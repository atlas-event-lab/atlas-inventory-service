server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      # Runtime traffic is multiplexed through the PgBouncer pooler; pods hold no warm
      # idle server connections (relieves cluster max_connections under HPA/KEDA scale-out).
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway keeps a DIRECT connection to Postgres (bypasses the PgBouncer pooler): in
    # transaction pool mode Flyway's session-level migration lock is unsafe. Reuses the
    # service role; local/compose fall back to DB_URL (no pooler there).
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    # The CNPG pooler's automatic auth_query creates a public.user_search function in every DB,
    # so `public` is non-empty before V1 runs. Adopt the schema: baseline at 0 (NOT the default 1,
    # which would skip V1). Only fires on the first run; no-op once the history table exists; inert
    # locally where `public` is empty. See ADR-0033.
    baseline-on-migrate: true
    baseline-version: "0"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/atlas}

  task:
    scheduling:
      pool:
        # Headroom so a long outbox drain cycle can't starve the other @Scheduled jobs.
        size: ${SCHEDULER_POOL_SIZE:3}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        spring.json.add.type.headers: 'false'
        # The outbox relay dispatches a whole poll batch before flushing (ADR-0013); let the
        # producer accumulate those sends briefly and ship them in few broker round-trips.
        linger.ms: 20
        batch.size: 65536
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: 'com.atlas.inventory.event'
        spring.json.value.default.type: com.atlas.inventory.event.EventEnvelope
        spring.json.use.type.headers: 'false'

atlas:
  outbox:
    # Adaptive relay scheduling (ADR-0013): poll fast under load, back off when idle.
    min-interval-ms: ${OUTBOX_MIN_INTERVAL_MS:250}
    max-interval-ms: ${OUTBOX_MAX_INTERVAL_MS:5000}
    max-drain-loops: ${OUTBOX_MAX_DRAIN_LOOPS:10}
  inventory:
    reservation:
      # Reservation Time-To-Live. The TTL sweep expires due RESERVED reservations.
      # Per the cascading timeout budget (services/inventory/state_machine.md, features/
      # booking-expiration *Timeout Ownership* addendum) it SHALL be >= the Payment timeout
      # and < the Booking pending-timeout safety-net (30m), so a reservation never expires
      # while payment is legitimately in flight.
      ttl: ${INVENTORY_RESERVATION_TTL:15m}
      sweep-interval-ms: ${INVENTORY_RESERVATION_SWEEP_INTERVAL_MS:60000}
    hotel:
      # Per-night hotel calendar (ADR-0008). Seeding materializes the nights [today, today + horizon);
      # the rolling job keeps the window this size and purges completed nights after the retention.
      horizon-days: ${INVENTORY_HOTEL_HORIZON_DAYS:365}
      purge-after-days: ${INVENTORY_HOTEL_PURGE_AFTER_DAYS:7}
      # "today" advances once a day, so the rolling job runs daily by default.
      roll-interval-ms: ${INVENTORY_HOTEL_ROLL_INTERVAL_MS:86400000}
      roll-initial-delay-ms: ${INVENTORY_HOTEL_ROLL_INITIAL_DELAY_MS:60000}

management:
  server:
    port: 9090
  tracing:
    baggage:
      remote-fields:
        - correlationId
      correlation:
        fields:
          - correlationId
    sampling:
      # Parent-based: the entry service's decision propagates via traceparent, so the whole Saga
      # samples coherently. 0.1 default bounds span volume (esp. per-SQL JDBC spans) so Tempo
      # survives load; bump TRACING_SAMPLING to 1.0 via env for a focused debug run.
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo.atlas-observability:4318/v1/traces}
  metrics:
    distribution:
      # Native Prometheus histogram buckets for HTTP server timings, so Grafana can compute
      # p95/p99 and draw per-endpoint latency heatmaps (RED / APM). Roadmap Phase 6/7.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, resync
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.atlas: INFO
    org.springframework.security: WARN
