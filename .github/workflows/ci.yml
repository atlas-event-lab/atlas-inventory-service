name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Unit tests (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon spotlessCheck checkstyleMain test

  image:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps promotion: write the immutable image tag into the GitOps repo `atlas` (the one ArgoCD
  # syncs — its remote is still hub.git via redirect, but the repo is named `atlas`), then ArgoCD
  # reconciles. Replaces the legacy `helm upgrade` push-deploy — CI no longer holds cluster
  # credentials. Requires the GitHub App (Contents: read/write) installed on the `atlas` repo,
  # exposed as vars.CI_BOT_APP_ID + secrets.CI_BOT_APP_PRIVATE_KEY.
  promote:
    name: Promote (write-back tag to the atlas GitOps repo)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Mint a scoped token for the atlas GitOps repo
        uses: actions/create-github-app-token@v1
        id: apptoken
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          owner: atlas-event-lab
          repositories: atlas
      - name: Checkout the atlas GitOps repo (desired state)
        uses: actions/checkout@v4
        with:
          repository: atlas-event-lab/atlas
          token: ${{ steps.apptoken.outputs.token }}
          path: gitops
      - name: Bump image tag and push (rebase-retry for concurrent services)
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"      # atlas-booking-service
          NAME="${REPO#atlas-}"              # booking-service   (helm release)
          VALUES="${NAME%-service}"          # booking           (values/<svc>.yaml)
          FILE="gitops/deploy/helm/atlas-service/values/${VALUES}.yaml"
          yq -i ".image.tag = \"sha-${GITHUB_SHA}\"" "$FILE"
          cd gitops
          git config user.name  "${{ steps.apptoken.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.apptoken.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deploy): ${NAME} -> sha-${GITHUB_SHA}" || { echo "already up to date"; exit 0; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "::error::could not push tag bump to the atlas GitOps repo after 5 attempts"; exit 1
